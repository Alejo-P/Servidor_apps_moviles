services:
  servidor-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servidor-python
    ports:
      - "5000:5000"
    networks:
      - red
    depends_on:
      mysql-server:
        condition: service_healthy
    volumes:
      - .:/app:cached  # 🔥 Usa un volumen administrado por Docker
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=${FLASK_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN}

  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    networks:
      - red
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - ./mysql:/var/lib/mysql  # 🔥 Usa un volumen administrado por Docker
    
  phpmyadmin-server:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-server
    environment:
      PMA_HOST: mysql-server
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - red
    depends_on:
      mysql-server:
        condition: service_healthy
    
networks:
  red:
    driver: bridge

volumes:
  mysql: